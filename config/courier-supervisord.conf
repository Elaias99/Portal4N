[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/portal4n-supervisord.pid
user=root

[program:apache]
command=/usr/local/bin/apache2-foreground
directory=/var/www/html
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:courier-geo-browser]
command=/usr/bin/chromedriver --port=9515 --allowed-ips=127.0.0.1 --log-level=OFF
directory=/var/www/html
user=www-data
environment=HOME="/tmp",TMPDIR="/tmp"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:courier-geo-capture]
command=/usr/local/bin/php -d memory_limit=2048M artisan queue:work courier-geo --queue=courier-geo --sleep=2 --tries=1 --timeout=3600 --memory=2048
directory=/var/www/html
user=www-data
environment=HOME="/tmp",TMPDIR="/tmp"
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=50
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
